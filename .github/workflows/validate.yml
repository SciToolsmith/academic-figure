name: Validate SciPlot

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sciplot-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
    env:
      SCIPLOT_DIAGNOSTICS: >-
        ${{ github.workspace }}/sciplot-diagnostics-${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "matplotlib>=3.7"

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          skill_file = Path("skills/sci-plot/SKILL.md")
          text = skill_file.read_text(encoding="utf-8")
          parts = text.split("---", 2)
          assert len(parts) == 3 and not parts[0].strip(), "Missing YAML frontmatter"
          metadata = yaml.safe_load(parts[1])
          assert metadata["name"] == "sci-plot"
          assert isinstance(metadata.get("description"), str) and metadata["description"].strip()

          agent = yaml.safe_load(
              Path("skills/sci-plot/agents/openai.yaml").read_text(encoding="utf-8")
          )["interface"]
          assert agent["display_name"] == "SciPlot｜科研绘图"
          assert 25 <= len(agent["short_description"]) <= 64
          assert "$sci-plot" in agent["default_prompt"]
          print("skill metadata: valid")
          PY

      - name: Reject platform junk
        run: |
          if find skills/sci-plot -name .DS_Store -print | grep -q .; then
            echo "platform junk found under skills/sci-plot" >&2
            exit 1
          fi

      - name: Compile Python surfaces
        run: |
          python -m compileall -q skills/sci-plot/scripts
          python -m compileall -q skills/sci-plot/tests
          python -m compileall -q skills/sci-plot/assets/case-packs
          python -m compileall -q skills/sci-plot/implementations

      - name: Run lightweight environment doctor
        run: |
          mkdir -p "$SCIPLOT_DIAGNOSTICS"
          python skills/sci-plot/scripts/sciplot_doctor.py \
            --pretty \
            --output "$SCIPLOT_DIAGNOSTICS/doctor.json"

      - name: Run regression tests
        run: python -m unittest discover -s skills/sci-plot/tests -v

      - name: Check vocabulary drift
        run: python skills/sci-plot/scripts/check_vocab_drift.py --pretty

      - name: Validate case index and assets
        run: |
          python skills/sci-plot/scripts/rank_cases.py --validate-only
          python skills/sci-plot/scripts/stage_case.py --validate-only

      - name: Validate native implementation metadata
        run: python skills/sci-plot/scripts/validate_implementations.py --pretty

      - name: Validate example Figure Contract gates
        run: |
          python skills/sci-plot/scripts/validate_contract.py \
            skills/sci-plot/references/figure-contract.example.json \
            --stage plan \
            --pretty
          python skills/sci-plot/scripts/validate_contract.py \
            skills/sci-plot/references/figure-contract.example.json \
            --stage pre-render \
            --pretty
          for contract in \
            skills/sci-plot/references/figure-contract.descriptive-composition.example.json \
            skills/sci-plot/references/figure-contract.descriptive-distribution.example.json \
            skills/sci-plot/references/figure-contract.descriptive-paired.example.json \
            skills/sci-plot/references/figure-contract.presentation-forest.example.json
          do
            python skills/sci-plot/scripts/validate_contract.py \
              "$contract" \
              --stage final \
              --pretty
          done

      - name: Run all verified native smoke and QA gates
        if: ${{ always() && matrix.python-version == '3.12' }}
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          mkdir -p "$SCIPLOT_DIAGNOSTICS/smoke"
          python skills/sci-plot/scripts/run_implementation_smoke.py \
            --output-root "$SCIPLOT_DIAGNOSTICS/smoke/bundles" \
            --output "$SCIPLOT_DIAGNOSTICS/smoke/report.json" \
            --pretty

      - name: Run deterministic evaluation probes
        if: ${{ always() && matrix.python-version == '3.12' }}
        run: |
          mkdir -p "$SCIPLOT_DIAGNOSTICS/evals"
          python skills/sci-plot/scripts/run_evals.py deterministic \
            --output "$SCIPLOT_DIAGNOSTICS/evals/report.json" \
            --pretty

      - name: Upload smoke, eval, and QA diagnostics
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v7
        with:
          name: sciplot-validation-diagnostics-py312
          path: ${{ env.SCIPLOT_DIAGNOSTICS }}
          if-no-files-found: warn
          retention-days: 14

  required:
    name: validate
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python matrix job
        env:
          MATRIX_RESULT: ${{ needs.validate.result }}
        run: test "$MATRIX_RESULT" = "success"
