name: Validate academic-figure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install metadata dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate package, index, links, and source syntax
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          from pathlib import Path

          import yaml

          root = Path("skills/academic-figure")
          assert root.is_dir()

          skill_text = (root / "SKILL.md").read_text(encoding="utf-8")
          parts = skill_text.split("---", 2)
          assert len(parts) == 3 and not parts[0].strip(), "Missing YAML frontmatter"
          metadata = yaml.safe_load(parts[1])
          assert metadata["name"] == "academic-figure"
          assert isinstance(metadata.get("description"), str) and metadata["description"].strip()

          agent = yaml.safe_load(
              (root / "agents/openai.yaml").read_text(encoding="utf-8")
          )
          assert agent["interface"]["display_name"] == "学术图形顾问"
          assert "$academic-figure" in agent["interface"]["default_prompt"]

          roadmap = json.loads(
              (root / "references/cases/open-template-roadmap.json").read_text(
                  encoding="utf-8"
              )
          )
          assert roadmap["status"] == "initial-release-validated"
          assert len(roadmap["candidates"]) == 23

          rows = [
              json.loads(line)
              for line in (root / "references/cases/case-index.jsonl")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]
          open_rows = [row for row in rows if row["releaseTier"] == "open-template"]
          atlas_rows = [row for row in rows if row["releaseTier"] == "atlas"]
          assert (len(rows), len(open_rows), len(atlas_rows)) == (180, 23, 157)

          atlas_assets = set()
          for row in rows:
              for preview in row["previews"]:
                  asset = root / preview["asset"]
                  assert asset.is_file() and asset.stat().st_size > 0, asset
                  atlas_assets.add(asset)
          assert len(atlas_assets) == 436

          for row in open_rows:
              assert row["openImplementation"] == {"python": True, "r": True}
              template = root / row["templatePath"]
              assert template.is_dir(), template
              assert (template / "README.md").is_file()
              assert len(list((template / "python").glob("*.py"))) == 1
              assert len(list((template / "r").glob("*.R"))) == 1
              demo_files = [
                  path
                  for folder in ("data", "demo")
                  for path in (template / folder).glob("*")
                  if path.is_file() and path.stat().st_size > 0
              ]
              assert demo_files, template
              for language in ("python", "r"):
                  preview = (
                      root
                      / "assets/open-templates"
                      / row["id"]
                      / f"preview-{language}.png"
                  )
                  assert preview.is_file() and preview.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n"

          for source in root.rglob("*.py"):
              ast.parse(source.read_text(encoding="utf-8"), filename=str(source))

          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          for readme in root.rglob("README.md"):
              for target in link_pattern.findall(readme.read_text(encoding="utf-8")):
                  target = target.strip().split("#", 1)[0]
                  if not target or "://" in target or target.startswith("#"):
                      continue
                  assert (readme.parent / target).resolve().exists(), (readme, target)

          forbidden = (
              "/" + "Users/",
              "/" + "Volumes/",
              "private/" + "generated-code",
              "科研图形库/" + "private",
              "file" + "://",
          )
          text_suffixes = {".md", ".py", ".R", ".r", ".json", ".jsonl", ".yaml", ".yml", ".csv", ".txt"}
          for path in root.rglob("*"):
              assert not path.is_symlink(), path
              assert path.name not in {".DS_Store", "__pycache__", ".Rhistory", ".RData"}, path
              if path.is_file() and path.suffix in text_suffixes:
                  text = path.read_text(encoding="utf-8", errors="replace")
                  assert not any(value in text for value in forbidden), path

          print(
              json.dumps(
                  {
                      "records": len(rows),
                      "open_templates": len(open_rows),
                      "atlas_only": len(atlas_rows),
                      "atlas_assets": len(atlas_assets),
                      "open_previews": len(open_rows) * 2,
                  },
                  indent=2,
              )
          )
          PY

      - name: Validate README and generated gallery
        run: |
          python .github/scripts/build_gallery.py --check
          python - <<'PY'
          import re
          from pathlib import Path

          docs = [Path("README.md"), Path("GALLERY.md"), Path("CASE_ASSETS.md")]
          markdown_links = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          html_links = re.compile(r'(?:href|src)="([^"]+)"')

          for doc in docs:
              text = doc.read_text(encoding="utf-8")
              targets = markdown_links.findall(text) + html_links.findall(text)
              for target in targets:
                  target = target.strip().split("#", 1)[0]
                  if not target or "://" in target:
                      continue
                  assert (doc.parent / target).resolve().exists(), (doc, target)

          gallery = Path("GALLERY.md").read_text(encoding="utf-8")
          case_ids = {
              line.split('"id": "', 1)[1].split('"', 1)[0]
              for line in Path(
                  "skills/academic-figure/references/cases/case-index.jsonl"
              ).read_text(encoding="utf-8").splitlines()
              if '"id": "' in line
          }
          assert len(case_ids) == 180
          assert all(case_id in gallery for case_id in case_ids)

          readme = Path("README.md").read_text(encoding="utf-8")
          assert readme.count('src="skills/academic-figure/assets/open-templates/') == 6
          print("root documentation: valid")
          PY

      - name: Parse all R template sources
        run: |
          find skills/academic-figure/templates -type f -name '*.R' \
            -exec Rscript --vanilla -e 'parse(file=commandArgs(TRUE)[1])' {} \;

      - name: Smoke-test case search
        run: |
          python skills/academic-figure/scripts/search_cases.py \
            "生存 风险表" --open-only --language python --limit 3
